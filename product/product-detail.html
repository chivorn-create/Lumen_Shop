<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <!-- CART CSS -->
    <link rel="stylesheet" href="/assets/styles/product-detail.css">
    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" >
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" >
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin >
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&display=swap" rel="stylesheet" >
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
    <button class="hamburger" onclick="toggleMenu()">☰</button>
    <span class="brand-name">
        LUMEN SHOP
    </span>
    <nav class="navbar" id="navbar">
        <a class="nav-item" href="/homepage.html">
            HOME
        </a>
        <a class="nav-item" href="/product/product.html">
            COLLECTION
        </a>
        <a class="nav-item" href="#">
            NEW ARRIVALS
        </a>
        <div class="dropdown">
            <button class="dropbtn">
                FILTER
            </button>
            <div class="dropdown-content">
                <a class="nav-item"
                   href="/product/menpage.html">
                    MEN
                </a>
                <a class="nav-item"
                   href="/product/womenpage.html">
                    WOMEN
                </a>
                <a class="nav-item"
                   href="/product/kidpage.html">
                    KIDS
                </a>
            </div>
        </div>
    </nav>
    <div class="other">
        <div class="search">
            <i id="icon" class="fa-solid fa-magnifying-glass"></i>
            <input class="input" type="text" name="search" placeholder="Search...">
        </div>
        <div class="login">
            <i class="fa-regular fa-user"></i>
        </div>
        <div class="icon cart-icon" onclick="goToCart()">
            <i id="icon" class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount">0</span>
        </div>
    </div>
</header>
<div class="detail-container">
        <!-- LEFT IMAGE -->
        <div class="detail-image">
            <img
                id="mainImage"
                src=""
                alt="Product">
        </div>
        <!-- RIGHT INFORMATION -->
        <div class="detail-info">
            <h1 id="productName">
                Product Name
            </h1>
            <!-- PRICE -->
            <div class="price-section">
                <span
                    id="productPrice"
                    class="sale-price">
                    $0.00
                </span>
                <span
                    id="productDiscount"
                    class="discount">
                    -40%
                </span>
                <span
                    id="productOldPrice"
                    class="old-price">
                    $0.00
                </span>
            </div>
            <!-- RATING -->
            <div
                id="rating"
                class="rating">
            </div>
            <!-- COLOR -->
            <h2>Color</h2>
            <div class="color-option">
                <img
                    id="colorImage"
                    src=""
                    alt="Product color">

                <p id="colorName">
                    Pink
                </p>
            </div>
            <!-- SIZE + QUANTITY -->
            <div class="selection-row">
                <!-- SIZE -->
                <div class="size-section">
                    <div class="size-title">
                        <h2>Size:</h2>
                        <span id="selectedSize">
                            Selected Size
                        </span>
                    </div>
                    <div class="size-buttons">
                        <button onclick="selectSize('S')">
                            S
                        </button>
                        <button onclick="selectSize('M')">
                            M
                        </button>
                        <button onclick="selectSize('L')">
                            L
                        </button>
                        <button onclick="selectSize('XL')">
                            XL
                        </button>
                    </div>
                </div>
                <!-- QUANTITY -->
                <div class="quantity-section">
                    <h2>Quantity:</h2>
                    <div class="quantity-box">
                        <button onclick="decreaseQuantity()">
                            [-]
                        </button>
                        <span id="quantity">
                            1
                        </span>
                        <button onclick="increaseQuantity()">
                            [+]
                        </button>
                    </div>
                </div>
            </div>
            <!-- CART -->
            <div class="cart-actions">
                <button
                    class="add-cart"
                    onclick="addToCart()">
                    Add to Cart
                </button>
                    <!-- <button class="wishlist">
                    ♡
                </button> -->
                <div class="wishlist"><i id="wishlist-btn" onclick="toggleWishlist(this)" class="fa-solid fa-heart"></i></div>
            </div>
        </div>
    </div>
    <script src="../assets/script/product-detail.js"></script>
</body>
</html>
